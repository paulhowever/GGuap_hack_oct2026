[project]
name = "karaoke-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "numpy>=1.26",
  "scipy>=1.13",
  "soundfile>=0.12",
  "swift-f0[audio]>=0.3",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "httpx2>=2",
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA"]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
omit = ["app/demo.py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PT", "N"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF046"]
