[project]
name = "karaoke-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "numpy>=1.26",
  "scipy>=1.13",
  "soundfile>=0.12",
  "swift-f0>=0.1.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA"]

[tool.ruff]
line-length = 110
