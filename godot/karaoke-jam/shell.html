<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>$GODOT_PROJECT_NAME</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0 }
body { background: #1e1a24; color: #f3e6d3; overflow: hidden; touch-action: none; font: 18px/1.4 Nunito, system-ui, sans-serif }
#canvas { display: block; width: 100vw; height: 100vh }
#canvas:focus { outline: none }
.kj-layer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1e1a24; z-index: 10 }
.kj-card { width: min(560px, 90vw); padding: 40px; border-radius: 24px; background: #2a2433; box-shadow: 0 0 48px rgba(255, 122, 61, .25); text-align: center }
.kj-card h1 { margin: 0 0 8px; font-size: 44px; color: #ff7a3d; letter-spacing: 1px }
.kj-card p { margin: 0 0 24px; opacity: .75 }
.kj-card input { box-sizing: border-box; width: 100%; padding: 14px 18px; margin-bottom: 20px; border: 2px solid #4a4055; border-radius: 14px; background: #1e1a24; color: inherit; font: inherit; font-size: 22px; text-align: center }
.kj-card input:focus { outline: none; border-color: #5fd3bc }
.kj-card button { width: 100%; padding: 20px; border: 0; border-radius: 16px; background: #ff7a3d; color: #1e1a24; font: inherit; font-size: 28px; font-weight: 800; cursor: pointer }
.kj-card button:disabled { opacity: .5; cursor: progress }
.kj-err { min-height: 1.4em; margin-top: 16px; color: #ff5d5d }
.kj-hint { margin-top: 12px; font-size: 15px; opacity: .55 }
#kj-progress { width: 100%; height: 6px; margin-top: 18px; accent-color: #5fd3bc }
#kj-nick-layer { display: none; background: rgba(20, 17, 24, .8) }
</style>
<!-- аудио-движок: window.VOICE_CONFIG и window.voice (?mock=<mode> ставит мок) -->
<!-- при запуске из редактора («Запустить в браузере») этих файлов рядом нет: Godot уйдёт в заглушку -->
<script src="config.js" onerror="window.kjVoiceMissing = true"></script>
<script type="module" src="voice.js" onerror="window.kjVoiceMissing = true"></script>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Ваш браузер не поддерживает canvas.</canvas>
<noscript>Для игры нужен JavaScript.</noscript>

<div id="kj-overlay" class="kj-layer">
  <div class="kj-card">
    <h1>KaraokeJam</h1>
    <p>Наденьте проводные наушники и разрешите доступ к микрофону.</p>
    <input id="kj-nickname" maxlength="24" placeholder="Ваш ник" autocomplete="nickname">
    <button id="kj-start">Нажми, чтобы начать</button>
    <progress id="kj-progress"></progress>
    <div id="kj-error" class="kj-err"></div>
    <div id="kj-mode" class="kj-hint"></div>
  </div>
</div>

<div id="kj-nick-layer" class="kj-layer">
  <div class="kj-card">
    <h1>Ник</h1>
    <input id="kj-nick-edit" maxlength="24">
    <button id="kj-nick-ok">Сохранить</button>
  </div>
</div>

<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
  const NICK_KEY = 'kj.nickname';
  const ERRORS = {
    insecure_context: 'Нужна защищённая страница: откройте по https или через localhost.',
    mic_denied: 'Браузер не дал доступ к микрофону. Разрешите его в адресной строке и нажмите ещё раз.',
    mic_not_found: 'Микрофон не найден. Подключите его и нажмите ещё раз.',
    audio_locked: 'Браузер заблокировал звук. Нажмите ещё раз.',
    worklet_failed: 'Аудио-движок не запустился. Обновите страницу.'
  };
  const $ = id => document.getElementById(id);
  const overlay = $('kj-overlay');
  const nick = $('kj-nickname');
  const startBtn = $('kj-start');
  const progress = $('kj-progress');
  const errBox = $('kj-error');
  let lastError = '';
  let started = false;
  let subscribed = false;

  try { nick.value = localStorage.getItem(NICK_KEY) || '' } catch (e) {}
  const mock = new URLSearchParams(location.search).get('mock');
  if (mock !== null) $('kj-mode').textContent = 'мок-режим: ' + (mock || 'perfect');

  function saveNick(v) {
    v = String(v || '').trim().slice(0, 24);
    try { localStorage.setItem(NICK_KEY, v) } catch (e) {}
    return v;
  }

  // Контракт для autoload WebShell (Godot): kjGetNickname / kjEditNickname / kjOnNicknameChanged
  window.kjGetNickname = () => (nick.value || '').trim();
  window.kjEditNickname = () => {
    $('kj-nick-edit').value = window.kjGetNickname();
    $('kj-nick-layer').style.display = 'flex';
    $('kj-nick-edit').focus();
  };
  function applyNickEdit() {
    const v = saveNick($('kj-nick-edit').value);
    if (v) nick.value = v;
    $('kj-nick-layer').style.display = 'none';
    $('canvas').focus();
    if (v && typeof window.kjOnNicknameChanged === 'function') window.kjOnNicknameChanged(v);
  }
  $('kj-nick-ok').onclick = applyNickEdit;
  $('kj-nick-edit').onkeydown = e => { if (e.key === 'Enter') applyNickEdit() };

  function fail(msg, fatal) {
    errBox.textContent = msg;
    startBtn.disabled = !!fatal;
    startBtn.textContent = fatal ? 'Недоступно' : 'Попробовать ещё раз';
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length) {
    fail('Браузер не поддерживает: ' + missing.join(', '), true);
    return;
  }
  // wasm и pck качаем сразу, пока игрок вводит ник
  // init() без базового пути падает, если движок ещё не загружен: передаём имя .wasm/.js
  const loaded = engine.init(GODOT_CONFIG.executable).then(() => { progress.style.display = 'none' });
  loaded.catch(err => { console.error(err); fail('Не удалось загрузить игру: ' + (err && err.message || err), true) });

  // voice.js — модуль (defer), ждём window.voice; null — файла нет или он не поднялся за 5 с
  function voiceReady() {
    const until = Date.now() + 5000;
    return new Promise(resolve => {
      const tick = () => {
        if (window.voice) return resolve(window.voice);
        if (window.kjVoiceMissing || Date.now() > until) return resolve(null);
        setTimeout(tick, 30);
      };
      tick();
    });
  }

  async function onStart() {
    if (started || startBtn.disabled) return;
    startBtn.disabled = true;
    startBtn.textContent = 'Включаем микрофон…';
    errBox.textContent = '';
    saveNick(nick.value);
    // если модуль уже загружен — без await, чтобы unlock() остался внутри жеста пользователя
    const voice = window.voice || await voiceReady();
    if (!voice) {
      // без аудио-движка: Godot сам переключится на встроенную заглушку
      console.warn('KaraokeJam: voice.js не найден — игра без микрофона (заглушка)');
      $('kj-mode').textContent = 'аудио-движок не найден — режим заглушки';
    } else {
      if (!subscribed) {
        subscribed = true;
        voice.subscribe((name, json) => {
          if (name !== 'on_error') return;
          try { lastError = JSON.parse(json).code } catch (e) { lastError = '' }
        });
      }
      lastError = '';
      let ok = false;
      try { ok = await voice.unlock() } catch (e) { console.error(e) }
      if (!ok) return fail(ERRORS[lastError] || 'Не получилось включить звук. Нажмите ещё раз.');
    }
    started = true;
    startBtn.textContent = 'Загрузка…';
    try {
      await loaded;
      // startGame переиспользует уже начатый init() и догружает pck
      await engine.startGame({
        onProgress: (cur, total) => {
          if (cur > 0 && total > 0) { progress.style.display = 'block'; progress.value = cur; progress.max = total }
        }
      });
    } catch (err) {
      console.error(err);
      started = false;
      return fail('Игра не запустилась: ' + (err && err.message || err));
    }
    overlay.remove();
    $('canvas').focus();
  }

  startBtn.onclick = onStart;
  nick.onkeydown = e => { if (e.key === 'Enter') onStart() };
  nick.focus();
}());
</script>
</body>
</html>
